<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>仙途 · Canvas 特效預覽</title>
<style>
body{margin:0;background:#0f141d;color:#f1f5f9;font-family:system-ui,"Noto Sans TC",sans-serif;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px}
#stage{position:relative;width:min(100%,800px);aspect-ratio:4/3;background:radial-gradient(ellipse at 50% 85%,#2a3550,#0b0f18 70%);border:3px solid #0f172a;border-radius:6px;overflow:hidden}
#stage canvas{position:absolute;inset:0;width:100%;height:100%}
#bar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:800px}
button{background:#1e293b;color:#f1f5f9;border:1px solid #475569;border-radius:6px;padding:8px 12px;font-size:14px;cursor:pointer}
button:hover{border-color:#f59e0b}
h4{margin:6px 0 0;color:#f59e0b;width:100%;text-align:center}
</style>
</head>
<body>
<div id="stage"><canvas id="bg"></canvas><canvas id="fx"></canvas></div>
<div id="bar"></div>
<script src="js/sprite-map.js"></script>
<script src="js/fx-lib.js"></script>
<script>
/* 預覽用：直接以 sprite-map 座標裁切精靈圖（精靈圖已去背），無需 3D */
const IMGS={};
const load=k=>new Promise(r=>{const i=new Image();i.onload=()=>r(IMGS[k]=i);i.onerror=()=>r(null);i.src=SHEET_SRC(k)});
const CH=[['sword','蜀山弟子 · 飛劍三斬','b:🧑\u200d🔧'],['heal','妙手醫仙 · 青蓮靈珠','b:🧑\u200d⚕'],['dog','靈犬哮天 · 利齒爪擊','b:🐕'],
 ['talisman','葉空 · 飛符敕令','b:🧔'],['thunder','凌雪 · 九天落雷','b:👩'],['dragonfire','趙烈 · 烈火飛龍','b:💂'],['swordqi','散修劍客 · 月牙劍氣','b:🕵'],['fa','護法法相 · 萬劍天降','b:🤖']];
const VT=[['v0','命門死穴'],['v1','軀幹丹田'],['v2','四肢脈絡']],EN=[['e_claw','爪擊'],['e_slash','刀斬'],['e_fire','火焰'],['e_poison','毒液'],['e_dark','暗影']];
const bg=document.getElementById('bg'),stage=document.getElementById('stage'),fx=FXLib.create(document.getElementById('fx'));
let me='b:🧔',foe='m:龍';
function draw(){const w=stage.clientWidth,h=stage.clientHeight,d=devicePixelRatio||1;bg.width=w*d;bg.height=h*d;const g=bg.getContext('2d');g.scale(d,d);
 const put=(k,x,y,H)=>{const r=SP[k],im=r&&IMGS[r[0]];if(!im)return;const s=H/r[4];g.drawImage(im,r[1],r[2],r[3],r[4],x-r[3]*s/2,y-H,r[3]*s,H)};
 put(foe,w*.68,h*.62,h*.34);put(me,w*.22,h*.86,h*.2)}
const pos=()=>({A:()=>[stage.clientWidth*.22,stage.clientHeight*.74],B:()=>[stage.clientWidth*.68,stage.clientHeight*.45]});
const bar=document.getElementById('bar'),add=(t,fn,cls)=>{if(t&&!cls){const h=document.createElement('h4');h.textContent=t;bar.appendChild(h);return}const b=document.createElement('button');b.textContent=t;b.onclick=fn;bar.appendChild(b)};
function sect(t){const h=document.createElement('h4');h.textContent=t;bar.appendChild(h)}
sect('角色攻擊');CH.forEach(([k,n,sp])=>add(n,()=>{me=sp;draw();fx.play(k,{...pos(),hit:k=='sword'||k=='dog'?190:k=='dragonfire'?420:k=='swordqi'||k=='talisman'?390:810,i:0,last:true})},1));
sect('神識鎖定');VT.forEach(([k,n])=>add(n,()=>fx.play(k,{A:pos().B,B:pos().B,hit:0}),1));
sect('妖魔反擊（目標為我方）');EN.forEach(([k,n])=>add(n,()=>fx.play(k,{A:pos().B,B:pos().A,hit:220}),1));
Promise.all(['zen','zen2','zen3'].map(load)).then(draw);addEventListener('resize',draw);
</script>
</body>
</html>
