<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>仙途遠征 · 乾坤界</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app"><div id="main">
 <div id="view" class="fr"><div id="hud"></div><div id="eb"></div><div id="fl"></div><div id="cb"><button onclick="event.stopPropagation();vatsOpen()">🎯神識</button><button onclick="event.stopPropagation();round()">⚔️攻擊</button><button onclick="event.stopPropagation();usePot()">💊丹藥</button><button onclick="event.stopPropagation();flee()">🏃遁走</button></div></div>
 <div id="log" class="fr"></div>
 <div id="party" class="fr"></div>
 <div id="pad">
  <div id="js"><button data-d="f" data-abs="dn" style="grid-area:1/2" title="往北">▲</button><button data-d="tl" data-abs="dw" style="grid-area:2/1" title="往西">◀</button><button id="cm" style="grid-area:2/2" title="切換操作模式">🧭</button><button data-d="tr" data-abs="de" style="grid-area:2/3" title="往東">▶</button><button data-d="b" data-abs="ds" style="grid-area:3/2" title="往南">▼</button></div>
  <div id="pbh"></div>
  <div id="pb"><button data-a="tl">↶</button><button data-a="tr">↷</button><button id="pt">💊</button><button id="mn" onclick="openSheet()" title="卷軸／儲物袋／修行">☰</button></div>
 </div>
 </div>
 <div id="side" class="fr"><div class="top"><canvas id="mm" width="160" height="160"></canvas><div class="st" id="st"></div></div>
  <div class="tabs"><button data-t="log" class="on" onclick="setTab('log')">📖 玉簡</button><button data-t="inv" onclick="setTab('inv')">🎒 儲物袋</button><button data-t="sp" onclick="setTab('sp')">🧘 功法</button><button data-t="mk" onclick="setTab('mk')">煉製</button><button data-t="bd" onclick="setTab('bd')">🏯 洞府</button><button data-t="sys" onclick="setTab('sys')">💾 存檔</button><button id="cl" onclick="closeSheet()" title="關閉">✕</button></div>
  <div id="tp"></div></div>
</div>

<div id="ov"><div class="box" id="ob"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/rot-js@2.2.0/dist/rot.min.js"></script>
<script>window.NO_PWA=1;</script>
<script src="js/safe-storage.js"></script>
<script>if(location.protocol==='file:')document.write('<script src="assets/img/sheets-inline.js"><\/script>')</script>
<script src="js/sprite-map.js"></script>
<script src="js/core.js"></script>
<script src="js/features.js"></script>
<script src="js/fx-lib.js"></script>
<script src="js/fx-bridge.js"></script>
<script src="js/main.js"></script>
<style>
#coffee-box{margin:0 0 10px;padding:10px;text-align:center;border:1px solid rgba(212,170,90,.45);border-radius:8px;background:rgba(212,170,90,.08)}
#coffee-box a{display:inline-block;padding:9px 18px;border-radius:999px;background:linear-gradient(135deg,#e8b866,#c98a3a);color:#2b1a05;font-weight:700;font-size:14px;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.35)}
#coffee-box a:active{transform:scale(.97)}
#coffee-box small{display:block;margin-top:6px;opacity:.7;font-size:11px}
</style>
<script>
/* 請創作者喝一杯拿鐵：固定顯示在「💾 存檔」分頁最上方 */
(function(){
 var URL='https://api.payuni.com.tw/api/uop/receive_info/2/3/U066100352/Gpnnwn6NWW9WIoPhS8YG9';
 function sysOn(){var b=document.querySelector('.tabs button[data-t="sys"]');return b&&b.classList.contains('on')}
 function ensure(){
  var tp=document.getElementById('tp');if(!tp)return;
  var box=document.getElementById('coffee-box');
  if(!sysOn()){if(box)box.remove();return}
  if(box&&box.parentNode===tp&&tp.firstChild===box)return;
  if(!box){
   box=document.createElement('div');box.id='coffee-box';
   box.innerHTML='<a href="'+URL+'" target="_blank" rel="noopener noreferrer">☕ 請創作者喝一杯拿鐵</a><small>喜歡這款遊戲嗎？你的支持是我持續更新的動力 🙏</small>';
  }
  tp.insertBefore(box,tp.firstChild);
 }
 function start(){
  var tp=document.getElementById('tp'),tabs=document.querySelector('.tabs');
  if(!tp||!tabs)return;
  var mo=new MutationObserver(ensure);
  mo.observe(tp,{childList:true});
  mo.observe(tabs,{attributes:true,subtree:true,attributeFilter:['class']});
  ensure();
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script>
</body>
</html>
